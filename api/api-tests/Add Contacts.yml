info:
  name: Add Contacts
  type: http
  seq: 5

http:
  method: POST
  url: "{{urlBase}}/api/index.php"
  headers:
    - name: Authorization
      value: Bearer 2
  body:
    type: json
    data: |-
      {
        "firstName": "Jim",
        "lastName": "mi"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
